; ARC-Play firmware – ESP32-S3-DevKitC-1 (N16R8) on the ARC_AP board.
; Pin map: src/pins.h, wiring: ../hardware/wiring/ARC-Play_Verdrahtung.svg

[env:esp32-s3-devkitm-1]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.filesystem = littlefs
build_flags =
    -DCONFIG_LWIP_IPV6=1
    -DARC_FW_VERSION=\"2.0.0-dev\"
lib_ignore = QNEthernet
lib_deps =
    ; ARC-Core: local checkout next to this repo during development.
    ; Release builds: https://github.com/probstj03/ARC-Core.git#vX.Y.Z
    symlink://../../ARC-Core
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit ILI9341 @ ^1.6.0
    https://github.com/pschatzmann/arduino-audio-tools/archive/refs/heads/main.zip
    adafruit/RTClib @ ^2.1.3
    mathieucarbou/ESPAsyncWebServer @ ^3.6.0
    bblanchon/ArduinoJson @ ^7.0.4
